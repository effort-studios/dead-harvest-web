name: CI

# Roda em todo PR para a main e em todo push na main. Para impedir o merge quando falhar, marque o job
# "Checks" como obrigatório em Settings > Branches (regra da main).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build (tsc + vite)
        run: npm run build
