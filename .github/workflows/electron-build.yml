name: Electron build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flag: --win
            name: windows
          - os: macos-latest
            flag: --mac
            name: macos
          - os: ubuntu-latest
            flag: --linux
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # a API que o app empacotado vai usar (sem isto, cai no http://localhost:3333)
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - run: npx electron-builder ${{ matrix.flag }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: dead-harvest-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage

  # só em tag: junta os três artifacts numa GitHub Release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          generate_release_notes: true
